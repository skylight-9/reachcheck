map $http_cf_connecting_ip $reach_client {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $reach_client zone=reach_api:10m rate=3r/s;
server {
    listen 80;
    server_name reach.mimxo.com reach.5.253.17.14.sslip.io;
    include /etc/nginx/cloudflare-allow.conf;
    client_max_body_size 8k;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    proxy_set_header Host reach.mimxo.com;
    proxy_set_header X-Real-IP $reach_client;
    proxy_set_header X-Forwarded-For $reach_client;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    location /api/ {
        limit_req zone=reach_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8792;
    }
    location / {
        proxy_pass http://127.0.0.1:8792;
    }
}
